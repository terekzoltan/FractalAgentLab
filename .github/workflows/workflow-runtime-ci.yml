name: Workflow runtime source checks
on:
  push:
    paths: ['tools/oc-session-router/**', 'tools/workflow-tooling/**', 'tools/workflow-experiments/**', '.github/workflows/workflow-runtime-ci.yml']
  pull_request:
    paths: ['tools/oc-session-router/**', 'tools/workflow-tooling/**', 'tools/workflow-experiments/**', '.github/workflows/workflow-runtime-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optional-measurement-fixtures:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard-library measurement tests
        run: python -B -m unittest discover -s tools/workflow-experiments -p "test_*.py" -v
      - name: Isolated synthetic technical pilot, no live activation
        shell: pwsh
        run: |
          python -B tools/workflow-experiments/workflow_experiments.py technical-pilot --ledger "$env:RUNNER_TEMP/experiment-technical-pilot.sqlite"
          if ($LASTEXITCODE -ne 0) { throw 'Technical pilot failed' }
  windows-offline-fixtures:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
          cache-dependency-path: tools/oc-session-router/runtime/package-lock.json
      - name: Install locked development dependencies without lifecycle scripts
        working-directory: tools/oc-session-router/runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test one active V2 runtime
        working-directory: tools/oc-session-router/runtime
        run: npm test
      - name: Windows PowerShell 5.1 facade and pure telemetry checks
        shell: powershell
        run: |
          & ./tools/oc-session-router/scripts/test-v2-launcher.ps1
          & ./tools/oc-session-router/scripts/test-session-context-status.ps1
          & ./tools/oc-session-router/scripts/test-handoff-launcher.ps1
      - name: Managed-tooling transaction fixtures only
        shell: powershell
        run: ./tools/workflow-tooling/tests/Test-WorkflowTooling.ps1

# These are source/fixture checks, not installed OpenCode or live pilot proof.
# No server credentials, runtime data, protected registry or live writer is used.
